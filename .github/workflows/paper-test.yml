name: Test symulowany SOL EMA50-200

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: sol-paper-forward-test
  cancel-in-progress: false

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz kod i poprzedni stan
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Przygotuj Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sprawdz mechanike symulacji
        run: python -m unittest test_cloud test_execution_paper -q
      - name: Odtworz brakujace minuty na publicznych danych
        run: python paper_sol.py
      - name: Zapisz czytelny wynik
        run: python cloud_report.py
      - name: Zachowaj stan na kolejne uruchomienie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- paper-sol-ema50-200-state.json paper-sol-ema50-200-result.json STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update SOL paper test results"
            git push origin HEAD
          fi
